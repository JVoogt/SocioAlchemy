server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/javascript image/svg+xml;
    gzip_min_length 256;

    # HTML-referenced code assets (unversioned filenames): cache briefly but
    # ALWAYS revalidate, so a deploy takes effect at the CDN edge instead of
    # being pinned for 30 days. `immutable` here was the bug — it told
    # Cloudflare the file never changes, serving stale CSS/JS after deploys.
    location ~* \.(css|js)$ {
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
    }

    # Media/font assets: long cache for performance, but not immutable so a
    # replaced file can still be revalidated or purged.
    location ~* \.(jpg|jpeg|png|gif|ico|svg|woff2?)$ {
        add_header Cache-Control "public, max-age=2592000" always;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
